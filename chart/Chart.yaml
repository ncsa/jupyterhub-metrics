apiVersion: v2
name: jupyterhub-metrics
description: A Helm chart for JupyterHub container metrics monitoring with TimescaleDB and Grafana
type: application

version: 1.3.0
appVersion: "1.3.0"

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Added Node Breakdown dashboard with cluster-level stats, per-node active users table, CPU/GPU user trends, GPU hours by model, and node summary table
    - kind: added
      description: Integrated golang-migrate for versioned database migration tracking via schema_migrations table
    - kind: added
      description: Added migrations ConfigMap containing all numbered migration files (000001-000004)
    - kind: changed
      description: Updated GPU node classification to use explicit GPU model patterns (v100, a100, h100, h200) instead of CPU-exclusion heuristic
    - kind: changed
      description: Added H200 GPU node support across all dashboards and database views
    - kind: changed
      description: Database init hook now runs on post-install and post-upgrade (previously post-install only)
    - kind: changed
      description: Replaced postgres:15-alpine init container with migrate/migrate image for schema management
    - kind: fixed
      description: Fixed all "active now" stat panels to use container_observations instead of session_end > NOW() (which always returned 0)
    - kind: fixed
      description: Fixed time-series "users over time" panels to use container_observations so long-running sessions are counted correctly
    - kind: fixed
      description: Fixed Node Breakdown stat panels to use lastNotNull from time-series query so they reflect the most recent collection rather than returning 0 when no observation falls in a hard-coded NOW()-15min window
    - kind: changed
      description: Changed Active Users per Node panel from a static table to a time-series line chart (one line per node) showing users per node over the selected time range

keywords:
  - jupyterhub
  - metrics
  - monitoring
  - timescaledb
  - grafana
  - kubernetes

home: https://github.com/ncsa/jupyterhub-metrics
sources:
  - https://github.com/ncsa/jupyterhub-metrics

maintainers:
  - name: NCSA
    url: https://www.ncsa.illinois.edu

dependencies: []

# Chart information
icon: https://raw.githubusercontent.com/grafana/grafana/master/public/img/grafana_icon.svg

# Kubeversion compatibility
kubeVersion: ">=1.20"

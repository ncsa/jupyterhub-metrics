apiVersion: v2
name: jupyterhub-metrics
description: A Helm chart for JupyterHub container metrics monitoring with TimescaleDB and Grafana
type: application

version: 1.2.5
appVersion: "1.2.5"

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Added Application Details dashboard with application selector dropdown
    - kind: added
      description: Added active sessions time series chart to Application Details dashboard
    - kind: added
      description: Added CPU vs GPU usage pie chart to Application Details dashboard
    - kind: added
      description: Added users table with GPU/CPU/Total hours breakdown to Application Details dashboard
    - kind: added
      description: Added colleges and departments usage tables to Application Details dashboard
    - kind: added
      description: Added summary statistics (Total Hours, Total Users, Total Sessions, Avg Session Duration) to Application Details dashboard
    - kind: fixed
      description: Made ingress.annotations, ingress.className, ingress.host, and ingress.tls optional in values.schema.json
    - kind: fixed
      description: Made grafana.port optional with default value of 3000
    - kind: fixed
      description: Made grafana.anonymous.orgName and orgRole optional when anonymous access is disabled
    - kind: fixed
      description: Made collector.interval optional with default value of 300 seconds

keywords:
  - jupyterhub
  - metrics
  - monitoring
  - timescaledb
  - grafana
  - kubernetes

home: https://github.com/ncsa/jupyterhub-metrics
sources:
  - https://github.com/ncsa/jupyterhub-metrics

maintainers:
  - name: NCSA
    url: https://www.ncsa.illinois.edu

dependencies: []

# Chart information
icon: https://raw.githubusercontent.com/grafana/grafana/master/public/img/grafana_icon.svg

# Kubeversion compatibility
kubeVersion: ">=1.20"

apiVersion: v2
name: jupyterhub-metrics
description: A Helm chart for JupyterHub container metrics monitoring with TimescaleDB and Grafana
type: application

version: 1.2.4
appVersion: "1.2.4"

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: Added Users by College table to demographics dashboard
    - kind: added
      description: Added Users by Application table to demographics dashboard
    - kind: added
      description: Added values.schema.json for Helm chart validation
    - kind: changed
      description: Updated Users by Job Title table to include GPU Hours, CPU Hours, and Total Hours columns
    - kind: changed
      description: Reorganized demographics dashboard into 2x2 grid layout (College, Department, Job Title, Application)

keywords:
  - jupyterhub
  - metrics
  - monitoring
  - timescaledb
  - grafana
  - kubernetes

home: https://github.com/ncsa/jupyterhub-metrics
sources:
  - https://github.com/ncsa/jupyterhub-metrics

maintainers:
  - name: NCSA
    url: https://www.ncsa.illinois.edu

dependencies: []

# Chart information
icon: https://raw.githubusercontent.com/grafana/grafana/master/public/img/grafana_icon.svg

# Kubeversion compatibility
kubeVersion: ">=1.20"

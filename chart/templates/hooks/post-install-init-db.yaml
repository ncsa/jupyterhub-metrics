{{- if .Values.timescaledb.enabled }}
# Post-install/post-upgrade hook: Run database migrations after TimescaleDB is running.
# Uses golang-migrate to apply all pending migrations from the migrations ConfigMap.
# The schema_migrations table tracks which migrations have been applied, making this
# safe to run on both fresh installs and upgrades (idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "jupyterhub-metrics.fullname" . }}-init-db
  namespace: {{ include "jupyterhub-metrics.namespace" . }}
  labels:
    {{- include "jupyterhub-metrics.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "jupyterhub-metrics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-init
    spec:
      {{- with .Values.advanced.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.advanced.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.advanced.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jupyterhub-metrics.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsUser: 1001
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for TimescaleDB to be ready at {{ include "jupyterhub-metrics.timescaledb.host" . }}:{{ .Values.timescaledb.database.port }}"
              until psql -c 'SELECT 1' >/dev/null 2>&1; do
                echo "Database is unavailable - sleeping"
                sleep 2
              done
              sleep 10
              echo "Database is available"
          env:
            - name: PGHOST
              value: {{ include "jupyterhub-metrics.timescaledb.host" . }}
            - name: PGPORT
              value: {{ include "jupyterhub-metrics.timescaledb.port" . | quote }}
            - name: PGDATABASE
              value: {{ .Values.timescaledb.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.timescaledb.database.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "jupyterhub-metrics.timescaledb.passwordSecret" . }}
                  key: {{ include "jupyterhub-metrics.timescaledb.passwordKey" . }}
      containers:
        - name: migrate
          image: migrate/migrate
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsUser: 65534
          env:
            - name: DB_HOST
              value: {{ include "jupyterhub-metrics.timescaledb.host" . }}
            - name: DB_PORT
              value: {{ include "jupyterhub-metrics.timescaledb.port" . | quote }}
            - name: DB_NAME
              value: {{ .Values.timescaledb.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.timescaledb.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "jupyterhub-metrics.timescaledb.passwordSecret" . }}
                  key: {{ include "jupyterhub-metrics.timescaledb.passwordKey" . }}
          args:
            - "-path=/migrations"
            - "-database=postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
            - "up"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "jupyterhub-metrics.fullname" . }}-migrations-hook
            defaultMode: 0444
{{- end }}
